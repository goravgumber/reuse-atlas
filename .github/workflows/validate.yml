name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate Agent Skill structure
        run: python skills/reuse-atlas/scripts/validate_skill.py
      - name: Run helper tests
        run: python -m unittest discover -s tests -v
